name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-35'
          sdkmanager 'build-tools;35.0.0'

      - name: Restore signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.METABASIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/metabasis-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/metabasis-signing/metabasis-upload.jks"
          chmod 600 "$RUNNER_TEMP/metabasis-signing/metabasis-upload.jks"

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          METABASIS_KEYSTORE_FILE: ${{ runner.temp }}/metabasis-signing/metabasis-upload.jks
          METABASIS_KEYSTORE_PASSWORD: ${{ secrets.METABASIS_KEYSTORE_PASSWORD }}
          METABASIS_KEY_ALIAS: ${{ secrets.METABASIS_KEY_ALIAS }}
          METABASIS_KEY_PASSWORD: ${{ secrets.METABASIS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: metabasis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: metabasis-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
